[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-in-a-box"
version = "0.1.0"
description = "Reproducible ML experiments + MLflow tracking + export + FastAPI serving pattern"
requires-python = ">=3.12"

[project.scripts]
mlbox-train = "mlops_box.train:main"
mlbox-serve = "mlops_box.serving.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
